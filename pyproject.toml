[project]
name = "fpm"
version = "0.1.0"
description = "Funnel Package Manager for the FunnelScript marketing programming language"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "FunnelScript Core Team", email = "core@funnelscript.org" },
]
dependencies = [
    "pydantic>=2.7.0",
    "tomli-w>=1.0.0",
    "click>=8.1.0",
]

[project.scripts]
fpm = "fpm.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fpm"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.100.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "pytest-xdist>=3.8.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-n auto"
